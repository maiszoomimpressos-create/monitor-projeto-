# MODELO: copie este arquivo para `docs/agendador-externo.github-actions.yml` (copiar para `.github/workflows/`) para ativar.
# (Não foi criado direto em .github/workflows porque o token usado pelo Grok Bot
#  não tem o escopo "workflow" do GitHub.)
# Agendador externo opcional (para intervalos menores que 1 dia no Vercel Hobby).
#
# Fica DESLIGADO até você configurar no GitHub (Settings > Secrets and variables > Actions):
#   Variable  ENABLE_EXTERNAL_SCHEDULER = true
#   Secret    MONITOR_CRON_URL = https://<seu-dominio>/api/cron/check-projects
#   Secret    CRON_SECRET      = o mesmo valor configurado na Vercel
# E na Vercel defina SCHEDULER_TICK_MINUTES=15 e SCHEDULER_TICK_OFFSET_MINUTES=0
# para o painel oferecer intervalos a partir de 15 min.
#
# Observação: o "schedule" do GitHub Actions não é exato (pode atrasar vários
# minutos ou pular execuções em horários de pico). O lock por projeto e a
# tolerância de meio tick evitam duplicidade e atrasos acumulados.
name: Agendador externo de checagens

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agendador-externo
  cancel-in-progress: false

jobs:
  chamar-rotina:
    if: vars.ENABLE_EXTERNAL_SCHEDULER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar /api/cron/check-projects
        env:
          MONITOR_CRON_URL: ${{ secrets.MONITOR_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$MONITOR_CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure os secrets MONITOR_CRON_URL e CRON_SECRET."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$MONITOR_CRON_URL"
